<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard de Processos - Finatec</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: linear-gradient(165deg, #faf9fc 0%, #f4f3f8 40%, #eeecf4 100%);
      --card: #fdfcfd;
      --text: #2c2247;
      --muted: #5c5570;
      --primary: #7b6d98;
      --danger: #7a1d1d;
      --border: #e4e1eb;
      --panel-bg: rgba(253, 252, 253, 0.97);
      --soft-bg: #f5f4f9;
      --table-head: #eceaf2;
      --table-odd: #faf9fc;
      --table-hover: #ebe8f2;
      --input-bg: #ffffff;
      --chart-muted: #52466e;
      --chart-grid: rgba(44, 34, 71, 0.08);
      --bar-dim: #cbc4d9;
      --accent-top: linear-gradient(90deg, #2c2247, #7b6d98);
      --accent-top-mid: linear-gradient(90deg, #52466e, #a697c4);
    }
    body.dark-theme {
      --bg: radial-gradient(ellipse 115% 75% at 50% -15%, #3d3558 0%, #2f2744 42%, #221b36 100%);
      --card: #322b45;
      --text: #f5f2fa;
      --muted: #c9bddf;
      --primary: #a697c4;
      --danger: #ff6b6b;
      --border: #4a4360;
      --panel-bg: rgba(43, 38, 58, 0.98);
      --soft-bg: #2e283d;
      --table-head: #3f3754;
      --table-odd: #2f293e;
      --table-hover: #3e3652;
      --input-bg: #383047;
      --chart-muted: #d8cef0;
      --chart-grid: rgba(229, 220, 245, 0.12);
      --bar-dim: #595070;
      --accent-top: linear-gradient(90deg, #2c2247, #52466e);
      --accent-top-mid: linear-gradient(90deg, #52466e, #a697c4);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .container {
      max-width: 1240px;
      margin: 28px auto;
      padding: 0 18px 28px;
    }
    .header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .title.title-with-brand {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px 18px;
      min-width: 0;
    }
    .brand-logo-link {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      line-height: 0;
    }
    .brand-logo {
      height: 52px;
      width: auto;
      max-width: min(240px, 38vw);
      object-fit: contain;
      display: block;
    }
    .title-brand-text {
      min-width: 0;
      flex: 1 1 200px;
    }
    .title h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #2c2247, #52466e, #a697c4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .title p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .controls label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      display: flex;
      gap: 8px;
      align-items: center;
      background: color-mix(in srgb, var(--card) 92%, transparent);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      box-shadow: 0 6px 18px rgba(44, 34, 71, 0.06);
    }
    body.dark-theme .controls label {
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }
    .controls select, .controls input {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 8px;
      font-size: 12px;
      min-width: 160px;
      color: var(--text);
      background: var(--input-bg);
    }
    .search-label input { min-width: 240px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin: 12px 0 18px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(44, 34, 71, 0.06);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 4px;
      background: var(--accent-top-mid);
    }
    .card.blue::before {
      background: var(--accent-top);
    }
    .card.orange::before {
      background: linear-gradient(90deg, #52466e, #7b6d98);
    }
    .card.red::before {
      background: linear-gradient(90deg, #7b6d98, #a697c4);
    }
    .card.purple::before {
      background: linear-gradient(90deg, #2c2247, #52466e);
    }
    .card.green::before {
      background: linear-gradient(90deg, #52466e, #a697c4);
    }
    .card h3 {
      margin: 0 0 10px;
      font-size: 12px;
      letter-spacing: 0.01em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }
    .card h3.alert-title {
      color: #ff1f1f;
      font-weight: 700;
    }
    .card h3 select {
      margin-left: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 12px;
      color: var(--text);
      background: var(--input-bg);
    }
    .metric {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .metric.small {
      font-size: 24px;
    }
    .metric-danger { color: #ff1f1f; }
    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 10px 28px rgba(44, 34, 71, 0.08);
    }
    body.dark-theme .panel {
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }
    .panel h2 {
      margin: 0 0 12px;
      font-size: 19px;
      letter-spacing: -0.01em;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .clear-btn {
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .clear-btn:hover {
      background: color-mix(in srgb, var(--primary) 15%, var(--input-bg));
    }
    .theme-btn {
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }
    body.dark-theme .theme-btn {
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }
    .theme-btn:hover {
      background: color-mix(in srgb, var(--primary) 12%, var(--input-bg));
    }
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 14px;
      margin-top: 10px;
    }
    .chart-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      background: linear-gradient(180deg, #fdfcfd 0%, var(--soft-bg) 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }
    body.dark-theme .chart-box {
      background: linear-gradient(180deg, #353047 0%, #2e283d 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .chart-box h3 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
      color: var(--text);
      line-height: 1.4;
    }
    .chart-box h3 .chart-hint {
      display: inline;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
    }
    .chart-canvas-wrap {
      height: 260px;
      width: 100%;
      position: relative;
    }
    #status {
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }
    .table-wrap {
      margin-top: 14px;
      overflow: auto;
      max-height: 280px;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .clickable-row {
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .clickable-row:hover {
      background: #ebe8f2 !important;
    }
    body.dark-theme .clickable-row:hover {
      background: #3e3652 !important;
    }
    .details-panel {
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--soft-bg);
      padding: 12px;
    }
    .details-panel h3 {
      margin: 0 0 8px;
      font-size: 14px;
      color: var(--text);
    }
    .details-context {
      margin: 0 0 12px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
    }
    .details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px 12px;
      font-size: 13px;
    }
    .details-grid strong {
      color: var(--muted);
    }
    body.dark-theme .details-grid strong {
      color: var(--muted);
    }
    .details-item {
      margin-bottom: 10px;
      padding: 10px;
      border: 1px solid color-mix(in srgb, var(--border) 85%, #ffffff 15%);
      border-left: 4px solid #7b6d98;
      border-radius: 8px;
      background: var(--card);
      box-shadow: inset 0 1px 0 rgba(0, 0, 0, 0.03);
    }
    .details-item:nth-child(even) {
      background: color-mix(in srgb, var(--card) 80%, var(--soft-bg) 20%);
    }
    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 860px;
      background: var(--card);
    }
    th, td {
      padding: 10px 11px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      text-align: left;
    }
    th {
      background: var(--table-head);
      position: sticky;
      top: 0;
      z-index: 1;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }
    tbody tr:nth-child(odd) { background: var(--table-odd); }
    tbody tr:hover { background: var(--table-hover); }
    body.dark-theme .title h1 {
      background: linear-gradient(90deg, #f3eefc, #d3c3f2, #a697c4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    body.dark-theme .brand-logo {
      filter: brightness(1.05) contrast(1.02);
    }
    body.dark-theme .details-item {
      border-left-color: #d3c3f2;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title title-with-brand">
        <a href="https://www.gov.br/funai/pt-br" class="brand-logo-link" target="_blank" rel="noopener noreferrer" title="FUNAI — site oficial">
          <img class="brand-logo" src="assets/funai-logo.png" alt="FUNAI — Fundação Nacional dos Povos Indígenas" decoding="async" />
        </a>
        <div class="title-brand-text">
          <h1>Dashboard de Processos</h1>
        </div>
      </div>
      <div class="controls">
        <button id="themeToggleBtn" class="theme-btn" type="button">🌙 Modo escuro</button>
        <label>Arquivo
          <input id="fileInput" type="file" accept=".csv,.xlsx,.xls" />
        </label>
        <label>Etapa
          <select id="etapaFilter"><option value="">Todas</option></select>
        </label>
        <label>Status
          <select id="statusFilter"><option value="">Todos</option></select>
        </label>
        <label class="search-label">Buscar nome
          <input id="nomeFilter" type="text" placeholder="ID, terra, povo ou responsável" />
        </label>
        <label>Tempo de Espera
          <select id="tempoFilter">
            <option value="">Todos</option>
            <option value="0-30">0 a 30 dias</option>
            <option value="31-90">31 a 90 dias</option>
            <option value="91-180">91 a 180 dias</option>
            <option value="181+">Acima de 180 dias</option>
          </select>
        </label>
        <label>Grau de Conflito
          <select id="conflitoFilter">
            <option value="">Todos</option>
            <option value="alto">Alto</option>
            <option value="medio">Médio</option>
            <option value="baixo">Baixo</option>
          </select>
        </label>
      </div>
    </div>

    <div class="grid">
      <div class="card blue">
        <h3>Total de Processos</h3>
        <div id="totalProcessos" class="metric">0</div>
      </div>
      <div class="card orange">
        <h3>Tempo Médio de Espera (dias)</h3>
        <div id="tempoMedio" class="metric">0</div>
      </div>
      <div class="card red">
        <h3 class="alert-title">Processos com Pendência Crítica</h3>
        <div id="pendenciaCritica" class="metric metric-danger">0</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>Processos por fase</h2>
        <button id="clearDrilldownBtn" class="clear-btn" type="button">Limpar seleção do gráfico</button>
      </div>
      <div class="chart-grid">
        <div class="chart-box">
          <h3>Fases <span class="chart-hint">(clique para detalhar)</span></h3>
          <div class="chart-canvas-wrap">
            <canvas id="funnelChart"></canvas>
          </div>
        </div>
        <div class="chart-box">
          <h3>Status da peça técnica <span class="chart-hint">(clique para abrir um processo)</span></h3>
          <div class="chart-canvas-wrap">
            <canvas id="statusChart"></canvas>
          </div>
        </div>
      </div>
      <div id="status"></div>
      <div class="table-wrap">
        <table>
          <thead><tr id="tableHead"></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div id="detailsPanel" class="details-panel">
        <h3>Detalhes do processo</h3>
        <div id="detailsContent">Carregando dados...</div>
      </div>
    </div>
  </div>

  <script>
    /* ========================================================= */
    /* DADOS EMBUTIDOS DO EXCEL: itens finatec.xlsx               */
    /* ========================================================= */
    const EMBEDDED_DATA = [
      ["012345.001/2026", "Vale do Araguaia",  "Quero-Quero", "Registro",    "2026-04-01", "Em andamento", "Isabelle Jablonski", "Baixo"],
      ["012345.001/2025", "Cerrado do Meio",   "Sucuri",      "Demarcação",  "2025-02-02", "Concluído",    "Ana Bonfim",         "Médio"],
      ["012345.001/2024", "Porto Garças",       "Garça",       "Demarcação",  "2025-11-01", "Concluído",    "Luana Borges",       "Alto"],
      ["012345.001/2023", "Ladeira do Rio",     "Jiboia",      "Demarcação",  "2024-09-12", "Pendente",     "Patrick Dias",       "Alto"],
      ["012345.001/2022", "Galinha Mansa",      "Penacho",     "Homologação", "2026-03-06", "Concluído",    "Moara Souza",        "Alto"]
    ];

    const fileInput = document.getElementById("fileInput");
    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const etapaFilter = document.getElementById("etapaFilter");
    const statusFilter = document.getElementById("statusFilter");
    const nomeFilter = document.getElementById("nomeFilter");
    const tempoFilter = document.getElementById("tempoFilter");
    const conflitoFilter = document.getElementById("conflitoFilter");
    const totalProcessosEl = document.getElementById("totalProcessos");
    const tempoMedioEl = document.getElementById("tempoMedio");
    const pendenciaCriticaEl = document.getElementById("pendenciaCritica");
    const statusEl = document.getElementById("status");
    const clearDrilldownBtn = document.getElementById("clearDrilldownBtn");
    const tableHead = document.getElementById("tableHead");
    const tableBody = document.getElementById("tableBody");
    const detailsContent = document.getElementById("detailsContent");

    let allRows = [];
    let visibleRows = [];
    let chart;
    let statusChart;
    let drilldownEtapa = "";

    function applyTheme(theme) {
      const isDark = theme === "dark";
      document.body.classList.toggle("dark-theme", isDark);
      themeToggleBtn.textContent = isDark ? "☀️ Modo claro" : "🌙 Modo escuro";
      if (allRows.length) renderDashboard();
    }

    function chartAxisColor() {
      return getComputedStyle(document.body).getPropertyValue("--chart-muted").trim() || "#3d5249";
    }

    function chartGridColor() {
      return getComputedStyle(document.body).getPropertyValue("--chart-grid").trim() || "rgba(20,30,18,0.1)";
    }

    function barDimColor() {
      return getComputedStyle(document.body).getPropertyValue("--bar-dim").trim() || "#c9d8c7";
    }

    const normalize = (value) =>
      String(value ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();

    function excelSerialToDate(serial) {
      const utcDays = Math.floor(Number(serial) - 25569);
      const utcValue = utcDays * 86400;
      const dateInfo = new Date(utcValue * 1000);
      return Number.isNaN(dateInfo.getTime()) ? null : dateInfo;
    }

    function parseDateBR(value) {
      if (value instanceof Date && !Number.isNaN(value.getTime())) return value;
      if (typeof value === "number" && Number.isFinite(value)) return excelSerialToDate(value);

      const text = String(value || "").trim();
      if (!text) return null;

      const dmy = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (dmy) {
        const [, dd, mm, yyyy] = dmy;
        const date = new Date(Number(yyyy), Number(mm) - 1, Number(dd));
        return Number.isNaN(date.getTime()) ? null : date;
      }

      const ymd = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (ymd) {
        const [, yyyy, mm, dd] = ymd;
        const date = new Date(Number(yyyy), Number(mm) - 1, Number(dd));
        return Number.isNaN(date.getTime()) ? null : date;
      }

      const jsDate = new Date(text);
      return Number.isNaN(jsDate.getTime()) ? null : jsDate;
    }

    function diasEmEspera(dateText) {
      const d = parseDateBR(dateText);
      if (!d) return null;
      const hoje = new Date();
      hoje.setHours(0, 0, 0, 0);
      const inicio = new Date(d);
      inicio.setHours(0, 0, 0, 0);
      return Math.max(0, Math.floor((hoje - inicio) / (1000 * 60 * 60 * 24)));
    }

    function rowFromArray(arr) {
      return {
        idProcesso: arr[0] || "",
        terraIndigena: arr[1] || "",
        povo: arr[2] || "",
        etapaAtual: arr[3] || "",
        dataInicioEtapaAtual: arr[4] || "",
        statusPecaTecnica: arr[5] || "",
        responsavelTecnico: arr[6] || "",
        grauConflito: arr[7] || ""
      };
    }

    function populateFilters(rows) {
      const etapas = [...new Set(rows.map((r) => r.etapaAtual).filter(Boolean))].sort();
      const status = [...new Set(rows.map((r) => r.statusPecaTecnica).filter(Boolean))].sort();

      etapaFilter.innerHTML = '<option value="">Todas</option>' +
        etapas.map((e) => `<option value="${e}">${e}</option>`).join("");
      statusFilter.innerHTML = '<option value="">Todos</option>' +
        status.map((s) => `<option value="${s}">${s}</option>`).join("");
    }

    function applyFilters() {
      const etapa = etapaFilter.value;
      const status = statusFilter.value;
      const nome = normalize(nomeFilter.value);
      const tempo = tempoFilter.value;
      const conflito = normalize(conflitoFilter.value);

      return allRows.filter((r) => {
        const okEtapa = !etapa || r.etapaAtual === etapa;
        const okStatus = !status || r.statusPecaTecnica === status;
        const textoBusca = normalize(`${r.idProcesso} ${r.terraIndigena} ${r.povo} ${r.responsavelTecnico}`);
        const okNome = !nome || textoBusca.includes(nome);
        const okConflito = !conflito || normalize(r.grauConflito) === conflito;
        const dias = diasEmEspera(r.dataInicioEtapaAtual);
        let okTempo = true;

        if (tempo === "0-30") okTempo = dias !== null && dias >= 0 && dias <= 30;
        if (tempo === "31-90") okTempo = dias !== null && dias >= 31 && dias <= 90;
        if (tempo === "91-180") okTempo = dias !== null && dias >= 91 && dias <= 180;
        if (tempo === "181+") okTempo = dias !== null && dias >= 181;

        return okEtapa && okStatus && okNome && okTempo && okConflito;
      });
    }

    function renderCards(rows) {
      const totalProcessos = rows.length;
      const listaDias = rows.map((r) => diasEmEspera(r.dataInicioEtapaAtual)).filter((v) => v !== null);
      const mediaDias = listaDias.length
        ? Math.round(listaDias.reduce((a, b) => a + b, 0) / listaDias.length)
        : 0;
      const pendenciasCriticas = rows.filter((r) => normalize(r.statusPecaTecnica) === "pendente").length;
      totalProcessosEl.textContent = totalProcessos;
      tempoMedioEl.textContent = mediaDias;
      pendenciaCriticaEl.textContent = pendenciasCriticas;
    }

    function renderFunnel(rows) {
      const counts = rows.reduce((acc, r) => {
        const etapa = r.etapaAtual || "Não informado";
        acc[etapa] = (acc[etapa] || 0) + 1;
        return acc;
      }, {});

      const labels = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
      const values = labels.map((l) => counts[l]);

      if (chart) chart.destroy();

      chart = new Chart(document.getElementById("funnelChart"), {
        type: "bar",
        data: {
          labels,
          datasets: [{
            label: "Processos",
            data: values,
            backgroundColor: labels.map((label, idx) => {
              if (drilldownEtapa && label !== drilldownEtapa) return barDimColor();
              const palette = ["#2c2247", "#52466e", "#7b6d98", "#a697c4", "#8f82ab", "#6b5d88", "#d3c3f2", "#b8aad6"];
              return palette[idx % palette.length];
            }),
            borderRadius: 6
          }]
        },
        options: {
          indexAxis: "y",
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: document.body.classList.contains("dark-theme") ? "#322b45" : "#ffffff",
              titleColor: document.body.classList.contains("dark-theme") ? "#f5f2fa" : "#2c2247",
              bodyColor: document.body.classList.contains("dark-theme") ? "#d8cef0" : "#52466e",
              borderColor: document.body.classList.contains("dark-theme") ? "#4a4360" : "#e4e1eb",
              borderWidth: 1
            }
          },
          scales: {
            x: {
              beginAtZero: true,
              ticks: {
                precision: 0,
                color: chartAxisColor()
              },
              grid: { color: chartGridColor() }
            },
            y: {
              ticks: { color: chartAxisColor() },
              grid: { color: chartGridColor() }
            }
          }
        }
      });
    }

    function renderStatusBreakdown(rows) {
      const counts = rows.reduce((acc, r) => {
        const status = r.statusPecaTecnica || "Não informado";
        acc[status] = (acc[status] || 0) + 1;
        return acc;
      }, {});

      const labels = Object.keys(counts);
      const values = labels.map((l) => counts[l]);

      if (statusChart) statusChart.destroy();

      statusChart = new Chart(document.getElementById("statusChart"), {
        type: "pie",
        data: {
          labels,
          datasets: [{
            data: values,
            backgroundColor: ["#2c2247", "#52466e", "#7b6d98", "#a697c4", "#d3c3f2", "#8f82ab"]
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: "bottom",
              labels: {
                color: chartAxisColor(),
                padding: 14,
                font: { size: 12, family: '"Inter", Arial, sans-serif' }
              }
            },
            tooltip: {
              backgroundColor: document.body.classList.contains("dark-theme") ? "#322b45" : "#ffffff",
              titleColor: document.body.classList.contains("dark-theme") ? "#f5f2fa" : "#2c2247",
              bodyColor: document.body.classList.contains("dark-theme") ? "#d8cef0" : "#52466e",
              borderColor: document.body.classList.contains("dark-theme") ? "#4a4360" : "#e4e1eb",
              borderWidth: 1
            }
          }
        }
      });
    }

    function renderTable(rows) {
      visibleRows = rows;
      const headers = [
        "ID do processo",
        "Terra Indígena",
        "Povo",
        "Etapa atual",
        "Data de início da etapa atual",
        "Status da Peça Técnica",
        "Responsável técnico",
        "Grau de conflito"
      ];

      tableHead.innerHTML = headers.map((h) => `<th>${h}</th>`).join("");
      tableBody.innerHTML = rows.map((r, idx) => `
        <tr class="clickable-row" data-row-index="${idx}">
          <td>${r.idProcesso}</td>
          <td>${r.terraIndigena}</td>
          <td>${r.povo}</td>
          <td>${r.etapaAtual}</td>
          <td>${r.dataInicioEtapaAtual}</td>
          <td>${r.statusPecaTecnica}</td>
          <td>${r.responsavelTecnico}</td>
          <td>${r.grauConflito}</td>
        </tr>
      `).join("");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function detailCardHtml(row) {
      return `
        <div class="details-item details-grid">
          <div><strong>ID do processo:</strong> ${escapeHtml(row.idProcesso || "-")}</div>
          <div><strong>Terra Indígena:</strong> ${escapeHtml(row.terraIndigena || "-")}</div>
          <div><strong>Povo:</strong> ${escapeHtml(row.povo || "-")}</div>
          <div><strong>Etapa atual:</strong> ${escapeHtml(row.etapaAtual || "-")}</div>
          <div><strong>Data de início:</strong> ${escapeHtml(row.dataInicioEtapaAtual || "-")}</div>
          <div><strong>Status da Peça Técnica:</strong> ${escapeHtml(row.statusPecaTecnica || "-")}</div>
          <div><strong>Responsável técnico:</strong> ${escapeHtml(row.responsavelTecnico || "-")}</div>
          <div><strong>Grau de conflito:</strong> ${escapeHtml(row.grauConflito || "-")}</div>
        </div>`;
    }

    function renderDetailsList(rows, context = {}) {
      const drilldownEtapa = context.drilldownEtapa || "";
      const pieStatus = context.pieStatus != null ? context.pieStatus : null;
      const emptyMessage = context.emptyMessage || "Nenhum processo com os filtros atuais.";

      if (!rows.length) {
        detailsContent.innerHTML = `<div>${emptyMessage}</div>`;
        return;
      }

      let intro = "";
      if (pieStatus != null && pieStatus !== "") {
        intro = `<p class="details-context">Status selecionado no gráfico: <strong>${escapeHtml(pieStatus)}</strong> (${rows.length} registro(s)). Ao alterar os filtros de cima ou a fase no gráfico, esta lista volta a acompanhar a visão principal.</p>`;
      } else {
        intro = drilldownEtapa
          ? `<p class="details-context">Exibindo <strong>${rows.length}</strong> registro(s) conforme filtros e fase no gráfico (<strong>${escapeHtml(drilldownEtapa)}</strong>).</p>`
          : `<p class="details-context">Exibindo <strong>${rows.length}</strong> registro(s) conforme filtros da barra superior (etapa, status, busca, tempo de espera, grau de conflito).</p>`;
      }

      detailsContent.innerHTML = intro + rows.map(detailCardHtml).join("");
    }

    function renderDetails(row) {
      if (!row) {
        detailsContent.innerHTML = allRows.length
          ? "Use os filtros ou clique em uma linha da tabela."
          : "Selecione um arquivo CSV ou XLSX acima para carregar os dados.";
        return;
      }

      detailsContent.innerHTML =
        `<p class="details-context">Registro selecionado na tabela.</p>` + detailCardHtml(row);
    }

    function renderDashboard() {
      const baseRows = applyFilters();
      if (drilldownEtapa && !baseRows.some((r) => (r.etapaAtual || "Não informado") === drilldownEtapa)) {
        drilldownEtapa = "";
      }

      const rows = drilldownEtapa
        ? baseRows.filter((r) => (r.etapaAtual || "Não informado") === drilldownEtapa)
        : baseRows;

      renderCards(rows);
      renderFunnel(baseRows);
      renderStatusBreakdown(rows);
      renderTable(rows);

      if (!allRows.length) {
        detailsContent.innerHTML = "Selecione um arquivo CSV ou XLSX acima para carregar os dados.";
      } else {
        renderDetailsList(rows, { drilldownEtapa });
      }

      const drillInfo = drilldownEtapa ? ` | Fase selecionada: ${drilldownEtapa}` : "";
      statusEl.textContent = `Registros carregados: ${allRows.length} | Exibidos: ${rows.length}${drillInfo}`;
    }

    function parseCsvSmart(text) {
      const lines = text
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter((line) => line.length > 0);
      if (lines.length === 0) return [];

      const semicolonCount = (lines[0].match(/;/g) || []).length;
      const commaCount = (lines[0].match(/,/g) || []).length;
      const delimiter = semicolonCount >= commaCount ? ";" : ",";

      const data = lines.map((line) => line.split(delimiter).map((cell) => cell.trim()));
      return data.slice(1).filter((r) => r.some((cell) => String(cell).trim() !== ""));
    }

    function loadCsvText(text) {
      const rows = parseCsvSmart(text);
      allRows = rows.map(rowFromArray);
      populateFilters(allRows);
      renderDashboard();
    }

    function loadWorkbook(arrayBuffer) {
      const workbook = XLSX.read(arrayBuffer, { type: "array", raw: false });
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(firstSheet, { header: 1, raw: false, defval: "" });
      const rows = data.slice(1).filter((r) => r.some((cell) => String(cell).trim() !== ""));
      allRows = rows.map(rowFromArray);
      populateFilters(allRows);
      renderDashboard();
    }

    function loadEmbeddedData() {
      allRows = EMBEDDED_DATA.map(rowFromArray);
      populateFilters(allRows);
      renderDashboard();
    }

    fileInput.addEventListener("change", async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;

      const name = file.name.toLowerCase();
      if (name.endsWith(".csv")) {
        const text = await file.text();
        loadCsvText(text);
      } else {
        const buffer = await file.arrayBuffer();
        loadWorkbook(buffer);
      }
    });

    etapaFilter.addEventListener("change", renderDashboard);
    statusFilter.addEventListener("change", renderDashboard);
    nomeFilter.addEventListener("input", renderDashboard);
    tempoFilter.addEventListener("change", renderDashboard);
    conflitoFilter.addEventListener("change", renderDashboard);
    themeToggleBtn.addEventListener("click", () => {
      const isDark = document.body.classList.contains("dark-theme");
      const nextTheme = isDark ? "light" : "dark";
      localStorage.setItem("dashboardTheme", nextTheme);
      applyTheme(nextTheme);
    });
    clearDrilldownBtn.addEventListener("click", () => {
      drilldownEtapa = "";
      renderDashboard();
    });
    document.getElementById("funnelChart").addEventListener("click", (event) => {
      if (!chart) return;
      const points = chart.getElementsAtEventForMode(event, "nearest", { intersect: true }, true);
      if (!points.length) return;
      const idx = points[0].index;
      const label = chart.data.labels[idx];
      drilldownEtapa = drilldownEtapa === label ? "" : label;
      renderDashboard();
    });
    document.getElementById("statusChart").addEventListener("click", (event) => {
      if (!statusChart) return;
      const points = statusChart.getElementsAtEventForMode(event, "nearest", { intersect: true }, true);
      if (!points.length) return;
      const idx = points[0].index;
      const label = statusChart.data.labels[idx];
      const rowsStatus = visibleRows.filter((r) => (r.statusPecaTecnica || "Não informado") === label);
      renderDetailsList(rowsStatus, {
        pieStatus: label,
        emptyMessage: `Nenhum processo com o status <strong>${escapeHtml(label)}</strong> na visão atual.`
      });
    });
    tableBody.addEventListener("click", (event) => {
      const rowEl = event.target.closest("tr[data-row-index]");
      if (!rowEl) return;
      const idx = Number(rowEl.dataset.rowIndex);
      if (Number.isNaN(idx)) return;
      renderDetails(visibleRows[idx]);
    });

    const savedTheme = localStorage.getItem("dashboardTheme") || "light";
    applyTheme(savedTheme);

    /* Carrega dados embutidos automaticamente ao abrir */
    loadEmbeddedData();
  </script>
</body>
</html>
